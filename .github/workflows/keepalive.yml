name: Keep Alive - Prevent Render Sleep

on:
  schedule:
    - cron: '0 * * * *'    # la fiecare ora, minutul 0
    - cron: '15 * * * *'   # la fiecare ora, minutul 15
    - cron: '30 * * * *'   # la fiecare ora, minutul 30
    - cron: '45 * * * *'   # la fiecare ora, minutul 45
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping JobPart
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://jobpart.onrender.com/api/jobs?per_pagina=1)
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Serverul este activ!"
          else
            echo "Atentie: server raspunde cu $STATUS"
          fi
