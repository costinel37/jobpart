<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - JobPart</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #2e1065 0%, #4c1d95 40%, #6d28d9 75%, #7c3aed 100%); }
    .btn-violet { background: linear-gradient(135deg, #7c3aed, #6d28d9); transition: all 0.2s; }
    .btn-violet:hover { box-shadow: 0 6px 20px rgba(124,58,237,0.5); transform: translateY(-1px); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <a href="/static/index.html" class="block text-center mb-8">
      <span class="text-2xl font-bold" style="background:linear-gradient(135deg,#7c3aed,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Job</span><span class="text-2xl font-bold text-gray-800">Part</span>
      <span class="text-xs align-top ml-1 bg-violet-100 text-violet-600 px-1.5 py-0.5 rounded-full font-semibold">✦</span>
    </a>
    <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">Bun venit înapoi!</h1>
    <p class="text-gray-500 text-center mb-8">Autentifică-te în contul tău</p>

    <div id="eroare" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 mb-5 text-sm"></div>

    <form id="login-form" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required placeholder="exemplu@email.com" autocomplete="email"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-violet-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Parolă</label>
        <div class="relative">
          <input type="password" id="parola" required placeholder="••••••••" autocomplete="current-password"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-violet-500" />
          <button type="button" onclick="toggleParola('parola', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" id="btn-login"
        class="btn-violet w-full text-white py-3 rounded-xl font-semibold text-lg">
        Autentificare
      </button>
    </form>

    <p class="text-center mt-4">
      <a href="/static/resetare-parola.html" class="text-sm text-gray-400 hover:text-violet-600">Ai uitat parola?</a>
    </p>
    <p class="text-center text-gray-500 mt-3">
      Nu ai cont?
      <a href="/static/register.html" class="text-violet-600 hover:underline font-medium">Înregistrează-te</a>
    </p>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    function toggleParola(id, btn) {
      const inp = document.getElementById(id);
      const isPass = inp.type === "password";
      inp.type = isPass ? "text" : "password";
      btn.querySelector("svg").innerHTML = isPass
        ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>'
        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
    }

    if (getToken()) {
      const user = getUser();
      if (user?.rol === "candidat") window.location.href = "/static/dashboard-candidat.html";
      else if (user?.rol === "angajator") window.location.href = "/static/dashboard-angajator.html";
      else if (user?.rol === "admin") window.location.href = "/static/admin.html";
    }
    const motiv = new URLSearchParams(window.location.search).get("motiv");
    if (motiv) {
      const el = document.getElementById("eroare");
      el.textContent = motiv;
      el.classList.remove("hidden");
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-login");
      const eroare = document.getElementById("eroare");
      eroare.classList.add("hidden");
      btn.textContent = "Se autentifică...";
      btn.disabled = true;

      try {
        const data = await apiFetch("/auth/login", {
          method: "POST",
          skipAuth: true,
          body: JSON.stringify({
            email: document.getElementById("email").value,
            parola: document.getElementById("parola").value,
          }),
        });
        saveSession(data);
        if (data.rol === "candidat") window.location.href = "/static/dashboard-candidat.html";
        else if (data.rol === "angajator") window.location.href = "/static/dashboard-angajator.html";
        else if (data.rol === "admin") window.location.href = "/static/admin.html";
      } catch (err) {
        eroare.textContent = err.message;
        eroare.classList.remove("hidden");
        btn.textContent = "Autentificare";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
