<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resetare Parolă - JobPart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-10">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
    <a href="/static/index.html" class="text-2xl font-bold text-blue-600 block text-center mb-8">Job<span class="text-gray-800">Part</span></a>

    <!-- Formular cerere resetare (fără token) -->
    <div id="form-cerere">
      <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">Resetare parolă</h1>
      <p class="text-gray-500 text-center mb-6">Introdu emailul contului tău și îți trimitem un link de resetare.</p>
      <div id="mesaj-cerere" class="hidden mb-4 rounded-xl px-4 py-3 text-sm"></div>
      <form id="form-cerere-submit" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="email-cerere" required placeholder="exemplu@email.com"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit" id="btn-cerere"
          class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition">
          Trimite link de resetare
        </button>
      </form>
      <p class="text-center text-gray-500 mt-6">
        <a href="/static/login.html" class="text-blue-600 hover:underline">Înapoi la login</a>
      </p>
    </div>

    <!-- Formular resetare cu token -->
    <div id="form-resetare" class="hidden">
      <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">Parolă nouă</h1>
      <p class="text-gray-500 text-center mb-6">Introdu noua ta parolă.</p>
      <div id="mesaj-resetare" class="hidden mb-4 rounded-xl px-4 py-3 text-sm"></div>
      <form id="form-resetare-submit" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Parolă nouă</label>
          <div class="relative">
            <input type="password" id="parola-noua" required placeholder="Minim 8 caractere"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <button type="button" onclick="toggleParola('parola-noua', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirmă parola</label>
          <div class="relative">
            <input type="password" id="parola-confirmare" required placeholder="Repetă parola"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <button type="button" onclick="toggleParola('parola-confirmare', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" id="btn-resetare"
          class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition">
          Salvează parola
        </button>
      </form>
    </div>

    <!-- Succes final -->
    <div id="succes-final" class="hidden text-center py-8">
      <div class="text-6xl mb-4">✅</div>
      <h1 class="text-2xl font-bold text-gray-800 mb-2">Parolă schimbată!</h1>
      <p class="text-gray-500 mb-6">Te poți autentifica cu noua parolă.</p>
      <a href="/static/login.html" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-blue-700 inline-block">
        Autentifică-te
      </a>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    function toggleParola(id, btn) {
      const inp = document.getElementById(id);
      const isPass = inp.type === "password";
      inp.type = isPass ? "text" : "password";
      btn.querySelector("svg").innerHTML = isPass
        ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>'
        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
    }
    const token = new URLSearchParams(window.location.search).get("token");

    if (token) {
      document.getElementById("form-cerere").classList.add("hidden");
      document.getElementById("form-resetare").classList.remove("hidden");
    }

    document.getElementById("form-cerere-submit").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-cerere");
      const mesaj = document.getElementById("mesaj-cerere");
      btn.disabled = true;
      btn.textContent = "Se trimite...";
      try {
        const r = await apiFetch(`/auth/reseteaza-parola/cerere?email=${encodeURIComponent(document.getElementById("email-cerere").value)}`, { method: "POST" });
        mesaj.className = "bg-green-50 border border-green-200 text-green-700 rounded-xl px-4 py-3 text-sm mb-4";
        mesaj.textContent = r.mesaj;
        mesaj.classList.remove("hidden");
        btn.textContent = "Trimis!";
      } catch (err) {
        mesaj.className = "bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm mb-4";
        mesaj.textContent = err.message;
        mesaj.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Trimite link de resetare";
      }
    });

    document.getElementById("form-resetare-submit").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-resetare");
      const mesaj = document.getElementById("mesaj-resetare");
      const parola = document.getElementById("parola-noua").value;
      const confirmare = document.getElementById("parola-confirmare").value;

      if (parola.length < 8) {
        mesaj.className = "bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm mb-4";
        mesaj.textContent = "Parola trebuie să aibă cel puțin 8 caractere.";
        mesaj.classList.remove("hidden");
        return;
      }
      if (parola !== confirmare) {
        mesaj.className = "bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm mb-4";
        mesaj.textContent = "Parolele nu coincid.";
        mesaj.classList.remove("hidden");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Se salvează...";
      try {
        await apiFetch("/auth/reseteaza-parola/confirma", {
          method: "POST",
          body: JSON.stringify({ token, parola_noua: parola }),
        });
        document.getElementById("form-resetare").classList.add("hidden");
        document.getElementById("succes-final").classList.remove("hidden");
      } catch (err) {
        mesaj.className = "bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm mb-4";
        mesaj.textContent = err.message;
        mesaj.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Salvează parola";
      }
    });
  </script>
</body>
</html>
