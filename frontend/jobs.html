<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joburi Part-Time - JobPart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/static/index.html" class="text-2xl font-bold text-blue-600">Job<span class="text-gray-800">Part</span></a>
      <div class="flex items-center gap-4">
        <a href="/static/jobs.html" class="text-blue-600 font-semibold">Joburi</a>
        <a href="/static/harta.html" class="text-gray-600 hover:text-blue-600 font-medium">🗺 Hartă</a>
        <div id="nav-auth" class="flex gap-2">
          <a href="/static/login.html" class="px-4 py-2 rounded-lg border border-blue-600 text-blue-600 hover:bg-blue-50 font-medium">Login</a>
          <a href="/static/register.html" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 font-medium">Înregistrare</a>
        </div>
        <div id="nav-user" class="hidden flex items-center gap-3">
          <a id="nav-dashboard" href="#" class="text-gray-600 hover:text-blue-600 font-medium">Dashboard</a>
          <a href="/static/mesaje.html" class="text-gray-600 hover:text-blue-600 font-medium">✉️ Mesaje</a>
          <a href="/static/notificari.html" id="nav-notif-bell" class="relative inline-flex items-center text-gray-600 hover:text-blue-600">
            <span class="text-xl">🔔</span>
            <span class="notif-badge hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold min-w-[16px] h-4 rounded-full flex items-center justify-center px-1 leading-none"></span>
          </a>
          <span class="text-gray-700 font-medium" id="nav-username"></span>
          <button onclick="logout()" class="px-4 py-2 rounded-lg bg-red-500 text-white hover:bg-red-600 font-medium">Ieșire</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-3xl font-bold text-gray-800">Joburi part-time</h1>
        <p id="rezultate-count" class="text-gray-500 mt-1"></p>
      </div>
    </div>

    <div class="grid lg:grid-cols-4 gap-6">
      <!-- Sidebar filtre -->
      <aside class="lg:col-span-1">
        <div class="bg-white rounded-xl shadow-sm p-5 sticky top-20">
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-gray-800">Filtre</h2>
            <button onclick="resetFiltre()" class="text-blue-600 text-sm hover:underline">Resetează</button>
          </div>

          <div class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Caută</label>
              <input id="f-cauta" type="text" placeholder="Job, companie..."
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Oraș</label>
              <input id="f-oras" type="text" placeholder="București, Cluj..."
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Categorie</label>
              <select id="f-categorie" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Toate categoriile</option>
                <option>IT</option><option>Retail</option><option>Educatie</option>
                <option>Livrari</option><option>HoReCa</option><option>Administrativ</option>
                <option>Marketing</option><option>Altele</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Salariu minim (RON)</label>
              <input id="f-salariu-min" type="number" placeholder="ex: 1500" min="0"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Salariu maxim (RON)</label>
              <input id="f-salariu-max" type="number" placeholder="ex: 4000" min="0"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Postate în ultimele</label>
              <select id="f-postate-in" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Oricând</option>
                <option value="7">7 zile</option>
                <option value="30">30 zile</option>
                <option value="90">90 zile</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Sortare</label>
              <select id="f-sortare" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="recent">Cele mai recente</option>
                <option value="salariu_desc">Salariu descrescător</option>
                <option value="salariu_asc">Salariu crescător</option>
              </select>
            </div>

            <button onclick="incarcaJoburi(1)"
              class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-semibold text-sm">
              Aplică filtrele
            </button>
          </div>
        </div>
      </aside>

      <!-- Lista joburi -->
      <main class="lg:col-span-3">
        <div id="jobs-container" class="space-y-4">
          <div class="text-center py-16 text-gray-400">Se încarcă...</div>
        </div>

        <!-- Paginare -->
        <div id="paginare" class="hidden flex justify-center gap-2 mt-8"></div>

        <div id="no-jobs" class="hidden text-center py-16 bg-white rounded-xl">
          <div class="text-5xl mb-4">🔍</div>
          <p class="text-xl text-gray-500">Nu am găsit joburi cu filtrele selectate.</p>
          <button onclick="resetFiltre()" class="mt-4 text-blue-600 hover:underline">Resetează filtrele</button>
        </div>
      </main>
    </div>
  </div>

  <footer class="bg-gray-800 text-gray-400 py-8 text-center mt-10">
    <p>© 2024 JobPart - Toate drepturile rezervate</p>
  </footer>

  <script src="/static/js/api.js"></script>
  <script>
    updateNav();

    const params = new URLSearchParams(window.location.search);
    if (params.get("cauta")) document.getElementById("f-cauta").value = params.get("cauta");
    if (params.get("categorie")) document.getElementById("f-categorie").value = params.get("categorie");

    let paginaCurenta = 1;
    const PER_PAGINA = 12;

    function buildQuery(pagina = 1) {
      const p = new URLSearchParams();
      const cauta = document.getElementById("f-cauta").value.trim();
      const oras = document.getElementById("f-oras").value.trim();
      const cat = document.getElementById("f-categorie").value;
      const salMin = document.getElementById("f-salariu-min").value;
      const salMax = document.getElementById("f-salariu-max").value;
      const postate = document.getElementById("f-postate-in").value;
      const sortare = document.getElementById("f-sortare").value;

      if (cauta) p.set("cauta", cauta);
      if (oras) p.set("oras", oras);
      if (cat) p.set("categorie", cat);
      if (salMin) p.set("salariu_min", salMin);
      if (salMax) p.set("salariu_max", salMax);
      if (postate) p.set("postate_in", postate);
      p.set("sortare", sortare);
      p.set("pagina", pagina);
      p.set("per_pagina", PER_PAGINA);
      return p.toString();
    }

    async function incarcaJoburi(pagina = 1) {
      paginaCurenta = pagina;
      const container = document.getElementById("jobs-container");
      container.innerHTML = '<div class="text-center py-16 text-gray-400">Se încarcă...</div>';
      document.getElementById("no-jobs").classList.add("hidden");
      document.getElementById("paginare").classList.add("hidden");

      try {
        const query = buildQuery(pagina);
        const [jobs, count] = await Promise.all([
          apiFetch(`/jobs?${query}`),
          apiFetch(`/jobs/count?${query}`)
        ]);

        const total = count.total;
        document.getElementById("rezultate-count").textContent =
          total === 0 ? "Niciun rezultat" : `${total} joburi găsite`;

        if (jobs.length === 0) {
          container.innerHTML = "";
          document.getElementById("no-jobs").classList.remove("hidden");
          return;
        }

        container.innerHTML = jobs.map(job => cardJob(job)).join("");
        randeazaPaginare(total, pagina);
      } catch (e) {
        container.innerHTML = '<div class="text-center py-16 text-red-400">Eroare la încărcarea joburilor. Verifică că serverul rulează.</div>';
      }
    }

    function randeazaPaginare(total, paginaCurenta) {
      const totalPagini = Math.ceil(total / PER_PAGINA);
      if (totalPagini <= 1) return;

      const paginare = document.getElementById("paginare");
      paginare.classList.remove("hidden");
      let html = "";

      if (paginaCurenta > 1)
        html += `<button onclick="incarcaJoburi(${paginaCurenta - 1})" class="px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50">← Anterior</button>`;

      for (let i = Math.max(1, paginaCurenta - 2); i <= Math.min(totalPagini, paginaCurenta + 2); i++) {
        html += `<button onclick="incarcaJoburi(${i})"
          class="px-4 py-2 rounded-lg border ${i === paginaCurenta ? 'bg-blue-600 text-white border-blue-600' : 'border-gray-300 hover:bg-gray-50'}">${i}</button>`;
      }

      if (paginaCurenta < totalPagini)
        html += `<button onclick="incarcaJoburi(${paginaCurenta + 1})" class="px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50">Următor →</button>`;

      paginare.innerHTML = html;
    }

    function cardJob(job) {
      const salariu = job.salariu_min
        ? `${job.salariu_min.toLocaleString()}${job.salariu_max ? ' - ' + job.salariu_max.toLocaleString() : '+'} RON`
        : "Negociabil";
      const promovatBadge = job.promovat
        ? `<span class="text-xs bg-yellow-400 text-yellow-900 px-2 py-1 rounded-full font-bold">⭐ Promovat</span>`
        : '';
      return `
        <a href="/static/job-detalii.html?id=${job.id}" class="bg-white rounded-xl p-5 shadow-sm hover:shadow-md transition border ${job.promovat ? 'border-yellow-300 ring-1 ring-yellow-200' : 'border-gray-100 hover:border-blue-300'} block">
          <div class="flex justify-between items-start mb-3">
            <div class="flex gap-2 flex-wrap">
              <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-medium">${job.categorie || 'Part-time'}</span>
              ${promovatBadge}
            </div>
            <span class="text-xs text-gray-400 whitespace-nowrap ml-2">${formatData(job.creat_la)}</span>
          </div>
          <h3 class="font-bold text-gray-800 text-lg mb-1">${escapeHtml(job.titlu)}</h3>
          <p class="text-blue-600 font-medium mb-3">${escapeHtml(job.companie)}</p>
          <p class="text-gray-500 text-sm mb-3 line-clamp-2">${escapeHtml(job.descriere)}</p>
          <div class="flex flex-wrap items-center gap-4 text-sm text-gray-500">
            <span>📍 ${job.oras}</span>
            <span>💰 ${salariu}</span>
            <span>⏰ ${job.tip_program}</span>
          </div>
        </a>`;
    }

    function resetFiltre() {
      ["f-cauta","f-oras","f-salariu-min","f-salariu-max"].forEach(id => document.getElementById(id).value = "");
      ["f-categorie","f-postate-in","f-sortare"].forEach(id => document.getElementById(id).selectedIndex = 0);
      incarcaJoburi(1);
    }

    // Caută la Enter
    ["f-cauta","f-oras","f-salariu-min","f-salariu-max"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") incarcaJoburi(1); });
    });
    ["f-categorie","f-postate-in","f-sortare"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => incarcaJoburi(1));
    });

    incarcaJoburi(1);
  </script>
</body>
</html>
