<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joburi Part-Time - JobPart</title>
  <meta name="description" content="Caută și filtrează sute de joburi part-time din toată România. IT, HoReCa, Retail, Livrări și multe altele. Aplică gratuit pe JobPart.ro." />
  <meta property="og:title" content="Joburi Part-Time România — JobPart" />
  <meta property="og:description" content="Sute de joburi part-time din toată România. Filtrează după oraș, categorie și salariu." />
  <meta property="og:url" content="https://jobpart.ro/static/jobs.html" />
  <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c3aed'/><text x='50%' y='50%' font-size='20' text-anchor='middle' dominant-baseline='central' fill='white' font-family='Arial'>J</text></svg>" />
  <meta name="theme-color" content="#7c3aed" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .heart-btn { background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; transition: all 0.2s; color: #9ca3af; }
    .heart-btn:hover { color: #a855f7; background: rgba(168,85,247,0.08); }
    .heart-btn.liked { color: #7c3aed; }
    .heart-btn.liked .heart-icon { animation: heartPop 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
    .heart-icon { font-size: 16px; line-height: 1; }
    @keyframes heartPop {
      0%  { transform: scale(1); }
      40% { transform: scale(1.45); filter: drop-shadow(0 0 6px #a855f7); }
      70% { transform: scale(0.9); }
      100%{ transform: scale(1); }
    }
  </style>
</head>
<body class="bg-gray-50 font-sans">

  <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-violet-100">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/static/index.html" class="text-2xl font-bold">
        <span style="background:linear-gradient(135deg,#7c3aed,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Job</span><span class="text-gray-800">Part</span>
        <span class="text-xs align-top ml-1 bg-violet-100 text-violet-600 px-1.5 py-0.5 rounded-full font-semibold">✦</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="/static/jobs.html" class="text-violet-600 font-semibold">Joburi</a>
        <a href="/static/harta.html" class="text-gray-600 hover:text-violet-600 font-medium transition">🗺 Hartă</a>
        <a href="/static/promotii.html" class="text-amber-600 hover:text-amber-700 font-medium transition">⭐ Promovează</a>
        <a href="/static/dashboard-angajator.html" class="px-4 py-2 rounded-xl font-semibold text-sm text-white transition" style="background:linear-gradient(135deg,#7c3aed,#6d28d9)">+ Publică anunț</a>
        <div id="nav-auth" class="flex gap-2">
          <a href="/static/login.html" class="px-4 py-2 rounded-xl border-2 border-violet-500 text-violet-600 hover:bg-violet-50 font-semibold transition">Login</a>
          <a href="/static/register.html" class="px-4 py-2 rounded-xl text-white font-semibold transition" style="background:linear-gradient(135deg,#7c3aed,#6d28d9)">Înregistrare</a>
        </div>
        <div id="nav-user" class="hidden flex items-center gap-3">
          <a id="nav-dashboard" href="#" class="text-gray-600 hover:text-violet-600 font-medium transition">Dashboard</a>
          <a href="/static/mesaje.html" class="text-gray-600 hover:text-violet-600 font-medium transition">✉️ Mesaje</a>
          <a href="/static/notificari.html" id="nav-notif-bell" class="relative inline-flex items-center text-gray-600 hover:text-violet-600">
            <span class="text-xl">🔔</span>
            <span class="notif-badge hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold min-w-[16px] h-4 rounded-full flex items-center justify-center px-1 leading-none"></span>
          </a>
          <span class="text-gray-700 font-medium" id="nav-username"></span>
          <button onclick="logout()" class="px-4 py-2 rounded-xl bg-red-500 text-white hover:bg-red-600 font-medium transition">Ieșire</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-3xl font-bold text-gray-800">Joburi part-time</h1>
        <p id="rezultate-count" class="text-gray-500 mt-1"></p>
      </div>
      <!-- Buton filtre mobil -->
      <button onclick="toggleFiltreМobil()" class="lg:hidden flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-xl font-semibold text-sm">
        ☰ Filtre
      </button>
    </div>

    <!-- Overlay filtre mobil -->
    <div id="filtre-overlay" onclick="toggleFiltreМobil()" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden"></div>

    <div class="grid lg:grid-cols-4 gap-6">
      <!-- Sidebar filtre -->
      <aside id="filtre-sidebar" class="lg:col-span-1 fixed lg:static inset-y-0 left-0 z-50 w-80 lg:w-auto -translate-x-full lg:translate-x-0 transition-transform duration-300">
        <div class="bg-white rounded-xl shadow-sm p-5 lg:sticky lg:top-20 h-full lg:h-auto overflow-y-auto">
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-gray-800">Filtre</h2>
            <div class="flex gap-2 items-center">
              <button onclick="resetFiltre()" class="text-blue-600 text-sm hover:underline">Resetează</button>
              <button onclick="toggleFiltreМobil()" class="lg:hidden text-gray-400 hover:text-gray-600 text-xl leading-none">×</button>
            </div>
          </div>
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-gray-800">Filtre</h2>
            <button onclick="resetFiltre()" class="text-blue-600 text-sm hover:underline">Resetează</button>
          </div>

          <div class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Caută</label>
              <input id="f-cauta" type="text" placeholder="Job, companie..."
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Oraș</label>
              <input id="f-oras" type="text" placeholder="București, Cluj..."
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Categorie</label>
              <select id="f-categorie" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Toate categoriile</option>
                <option value="IT">IT</option>
                <option value="Retail">Retail</option>
                <option value="Educatie">Educatie</option>
                <option value="Livrari">Livrari</option>
                <option value="HoReCa">HoReCa</option>
                <option value="Administrativ">Administrativ</option>
                <option value="Marketing">Marketing</option>
                <option value="Constructii">Construcții</option>
                <option value="Transport">Transport</option>
                <option value="Service Auto">Service Auto / Mecanici</option>
                <option value="Altele">Altele</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Salariu minim (RON)</label>
              <input id="f-salariu-min" type="number" placeholder="ex: 1500" min="0"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Salariu maxim (RON)</label>
              <input id="f-salariu-max" type="number" placeholder="ex: 4000" min="0"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Postate în ultimele</label>
              <select id="f-postate-in" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Oricând</option>
                <option value="7">7 zile</option>
                <option value="30">30 zile</option>
                <option value="90">90 zile</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Sortare</label>
              <select id="f-sortare" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="recent">Cele mai recente</option>
                <option value="salariu_desc">Salariu descrescător</option>
                <option value="salariu_asc">Salariu crescător</option>
              </select>
            </div>

            <button onclick="incarcaJoburi(1)"
              class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-semibold text-sm">
              Aplică filtrele
            </button>
          </div>
        </div>
      </aside>

      <!-- Lista joburi -->
      <main class="lg:col-span-3">
        <div id="jobs-container" class="space-y-4">
          <div class="text-center py-16 text-gray-400">Se încarcă...</div>
        </div>

        <!-- Paginare -->
        <div id="paginare-wrap" class="hidden mt-10">
          <p id="paginare-info" class="text-center text-sm text-gray-500 mb-4"></p>
          <div id="paginare" class="flex justify-center gap-2 flex-wrap"></div>
        </div>

        <div id="no-jobs" class="hidden text-center py-16 bg-white rounded-xl">
          <div class="text-5xl mb-4">🔍</div>
          <p class="text-xl text-gray-500">Nu am găsit joburi cu filtrele selectate.</p>
          <button onclick="resetFiltre()" class="mt-4 text-blue-600 hover:underline">Resetează filtrele</button>
        </div>
      </main>
    </div>
  </div>

  <footer class="bg-gray-800 text-gray-400 py-8 text-center mt-10">
    <p>© 2024 JobPart - Toate drepturile rezervate</p>
  </footer>

  <!-- Toast notificare pentru acțiuni care necesită autentificare -->
  <div id="toast-auth" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden">
    <div class="bg-gray-900 text-white px-6 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-medium">
      <span id="toast-auth-msg"></span>
      <a href="/static/login.html" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-semibold">Login</a>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    // ── LIKES ────────────────────────────────────────────────────────────────
    const LIKED_KEY = "jp_liked_jobs";

    function getLikedSet() {
      try { return new Set(JSON.parse(localStorage.getItem(LIKED_KEY) || "[]")); }
      catch { return new Set(); }
    }

    function isLiked(jobId) { return getLikedSet().has(jobId); }

    async function toggleLike(e, jobId) {
      e.preventDefault();
      e.stopPropagation();
      const btn = document.getElementById(`like-${jobId}`);
      const icon = btn?.querySelector(".heart-icon");
      const countEl = document.getElementById(`like-count-${jobId}`);
      if (!btn) return;

      try {
        const res = await fetch(API_BASE + `/jobs/${jobId}/like`, { method: "POST" });
        const data = await res.json();

        // Actualizeaza localStorage
        const liked = getLikedSet();
        if (data.liked) liked.add(jobId); else liked.delete(jobId);
        localStorage.setItem(LIKED_KEY, JSON.stringify([...liked]));

        // Actualizeaza UI
        btn.classList.toggle("liked", data.liked);
        if (icon) icon.textContent = data.liked ? "💜" : "🤍";
        if (countEl) countEl.textContent = data.total;
      } catch {}
    }

    async function incarcaLikes(jobIds) {
      for (const id of jobIds) {
        try {
          const data = await fetch(API_BASE + `/jobs/${id}/like`).then(r => r.json());
          const btn = document.getElementById(`like-${id}`);
          const icon = btn?.querySelector(".heart-icon");
          const countEl = document.getElementById(`like-count-${id}`);
          if (btn) btn.classList.toggle("liked", data.liked);
          if (icon) icon.textContent = data.liked ? "💜" : "🤍";
          if (countEl) countEl.textContent = data.total;
        } catch {}
      }
    }
    // ─────────────────────────────────────────────────────────────────────────

    // Initializare navigare — updateNav() din api.js afișează Login/Register sau Dashboard/Ieșire
    updateNav();

    // Preia parametrii din URL (de la index.html: ?categorie=X sau ?cauta=X)
    const params = new URLSearchParams(window.location.search);
    if (params.get("cauta")) document.getElementById("f-cauta").value = params.get("cauta");
    if (params.get("categorie")) {
      const selectCategorie = document.getElementById("f-categorie");
      // Caută option cu value sau text egal cu parametrul primit
      const valCat = params.get("categorie");
      const optFound = Array.from(selectCategorie.options).find(
        o => o.value === valCat || o.text === valCat
      );
      if (optFound) selectCategorie.value = optFound.value;
    }

    let paginaCurenta = 1;
    const PER_PAGINA = 12;

    async function publicFetch(path) {
      const res = await fetch(API_BASE + path);
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Eroare la server");
      return data;
    }

    function buildQuery(pagina = 1) {
      const p = new URLSearchParams();
      const cauta = document.getElementById("f-cauta").value.trim();
      const oras = document.getElementById("f-oras").value.trim();
      const cat = document.getElementById("f-categorie").value;
      const salMin = document.getElementById("f-salariu-min").value;
      const salMax = document.getElementById("f-salariu-max").value;
      const postate = document.getElementById("f-postate-in").value;
      const sortare = document.getElementById("f-sortare").value;

      if (cauta) p.set("cauta", cauta);
      if (oras) p.set("oras", oras);
      if (cat) p.set("categorie", cat);
      if (salMin) p.set("salariu_min", salMin);
      if (salMax) p.set("salariu_max", salMax);
      if (postate) p.set("postate_in", postate);
      p.set("sortare", sortare);
      p.set("pagina", pagina);
      p.set("per_pagina", PER_PAGINA);
      return p.toString();
    }

    async function incarcaJoburi(pagina = 1) {
      paginaCurenta = pagina;
      const container = document.getElementById("jobs-container");
      container.innerHTML = '<div class="text-center py-16 text-gray-400">Se încarcă...</div>';
      document.getElementById("no-jobs").classList.add("hidden");
      document.getElementById("paginare-wrap").classList.add("hidden");

      try {
        const query = buildQuery(pagina);
        // Folosim publicFetch pentru endpoint-uri publice — nu necesită autentificare
        const [jobs, count] = await Promise.all([
          publicFetch(`/jobs?${query}`),
          publicFetch(`/jobs/count?${query}`)
        ]);

        const total = count.total;
        document.getElementById("rezultate-count").textContent =
          total === 0 ? "Niciun rezultat" : `${total} joburi găsite`;

        if (jobs.length === 0) {
          container.innerHTML = "";
          document.getElementById("no-jobs").classList.remove("hidden");
          return;
        }

        container.innerHTML = jobs.map(job => cardJob(job)).join("");
        incarcaLikes(jobs.map(j => j.id));
        randeazaPaginare(total, pagina);
      } catch (e) {
        container.innerHTML = '<div class="text-center py-16 text-red-400">Eroare la încărcarea joburilor. Verifică că serverul rulează.</div>';
      }
    }

    function randeazaPaginare(total, paginaCurenta) {
      const totalPagini = Math.ceil(total / PER_PAGINA);
      const wrap = document.getElementById("paginare-wrap");
      const paginare = document.getElementById("paginare");
      const info = document.getElementById("paginare-info");

      if (totalPagini <= 1) { wrap.classList.add("hidden"); return; }

      const de_la = (paginaCurenta - 1) * PER_PAGINA + 1;
      const pana_la = Math.min(paginaCurenta * PER_PAGINA, total);
      info.textContent = `Se afișează ${de_la}–${pana_la} din ${total} joburi`;

      wrap.classList.remove("hidden");
      let html = "";

      if (paginaCurenta > 1)
        html += `<button onclick="incarcaJoburi(${paginaCurenta - 1})" class="px-4 py-2 rounded-xl border-2 border-violet-300 text-violet-600 hover:bg-violet-50 font-semibold">← Anterior</button>`;

      for (let i = Math.max(1, paginaCurenta - 2); i <= Math.min(totalPagini, paginaCurenta + 2); i++) {
        html += `<button onclick="incarcaJoburi(${i})" class="px-4 py-2 rounded-xl border-2 font-semibold ${i === paginaCurenta
          ? 'bg-violet-600 text-white border-violet-600 shadow-md'
          : 'border-violet-200 text-violet-600 hover:bg-violet-50'}">${i}</button>`;
      }

      if (paginaCurenta < totalPagini)
        html += `<button onclick="incarcaJoburi(${paginaCurenta + 1})" class="px-4 py-2 rounded-xl border-2 border-violet-300 text-violet-600 hover:bg-violet-50 font-semibold">Următor →</button>`;

      paginare.innerHTML = html;
      wrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    // Afișează toast când utilizatorul neautentificat încearcă o acțiune protejată
    function toastAuthNecesar(actiune) {
      const toast = document.getElementById("toast-auth");
      document.getElementById("toast-auth-msg").textContent =
        `Autentifică-te pentru a ${actiune}.`;
      toast.classList.remove("hidden");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.add("hidden"), 4000);
    }

    // Handler pentru butonul de favorite — disponibil și neautentificat (afișează mesaj)
    function toggleFavorit(event, jobId) {
      event.preventDefault();
      event.stopPropagation();
      if (!getUser()) {
        toastAuthNecesar("salva joburi la favorite");
        return;
      }
      // Utilizator logat — apel API
      apiFetch(`/favorite/${jobId}`, { method: "POST" })
        .then(() => incarcaJoburi(paginaCurenta))
        .catch(e => alert(e.message));
    }

    // Handler pentru butonul de aplicare — disponibil și neautentificat (afișează mesaj)
    function aplicaJob(event, jobId) {
      event.preventDefault();
      event.stopPropagation();
      if (!getUser()) {
        toastAuthNecesar("aplica la acest job");
        return;
      }
      // Utilizator logat — redirecționăm la pagina jobului
      window.location.href = `/static/job-detalii.html?id=${jobId}`;
    }

    function cardJob(job) {
      const salariu = job.salariu_min
        ? `${job.salariu_min.toLocaleString()}${job.salariu_max ? ' - ' + job.salariu_max.toLocaleString() : '+'} RON`
        : "Negociabil";
      const promovatBadge = job.promovat
        ? `<span class="text-xs bg-yellow-400 text-yellow-900 px-2 py-1 rounded-full font-bold">⭐ Promovat</span>`
        : '';
      const descriere = job.descriere ? escapeHtml(job.descriere) : '';
      const tipProgram = job.tip_program ? `<span>⏰ ${escapeHtml(job.tip_program)}</span>` : '';

      return `
        <a href="/static/job-detalii.html?id=${job.id}" class="bg-white rounded-xl p-5 shadow-sm hover:shadow-md transition border ${job.promovat ? 'border-yellow-300 ring-1 ring-yellow-200' : 'border-gray-100 hover:border-blue-300'} block">
          <div class="flex justify-between items-start mb-3">
            <div class="flex gap-2 flex-wrap">
              <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-medium">${escapeHtml(job.categorie) || 'Part-time'}</span>
              ${promovatBadge}
            </div>
            <div class="flex items-center gap-2 ml-2">
              <span class="text-xs text-gray-400 whitespace-nowrap">${formatData(job.creat_la)}</span>
              <button
                onclick="toggleFavorit(event, ${job.id})"
                title="Salvează la favorite"
                class="text-gray-300 hover:text-yellow-400 transition text-lg leading-none"
              >♥</button>
            </div>
          </div>
          <h3 class="font-bold text-gray-800 text-lg mb-1">${escapeHtml(job.titlu)}</h3>
          <p class="text-blue-600 font-medium mb-3">${escapeHtml(job.companie)}</p>
          ${descriere ? `<p class="text-gray-500 text-sm mb-3 line-clamp-2">${descriere}</p>` : ''}
          <div class="flex flex-wrap items-center justify-between gap-3 text-sm text-gray-500">
            <div class="flex items-center gap-4">
              <span>📍 ${escapeHtml(job.oras)}</span>
              <span>💰 ${salariu}</span>
              ${tipProgram}
            </div>
            <button
              id="like-${job.id}"
              class="heart-btn ${isLiked(job.id) ? 'liked' : ''}"
              onclick="toggleLike(event, ${job.id})"
              title="Apreciază acest anunț"
            >
              <span class="heart-icon">${isLiked(job.id) ? '💜' : '🤍'}</span>
              <span id="like-count-${job.id}">0</span>
            </button>
          </div>
        </a>`;
    }

    function toggleFiltreМobil() {
      const sidebar = document.getElementById("filtre-sidebar");
      const overlay = document.getElementById("filtre-overlay");
      const isOpen = !sidebar.classList.contains("-translate-x-full");
      sidebar.classList.toggle("-translate-x-full", isOpen);
      overlay.classList.toggle("hidden", isOpen);
    }

    function resetFiltre() {
      ["f-cauta","f-oras","f-salariu-min","f-salariu-max"].forEach(id => document.getElementById(id).value = "");
      ["f-categorie","f-postate-in","f-sortare"].forEach(id => document.getElementById(id).selectedIndex = 0);
      incarcaJoburi(1);
    }

    // Caută la Enter sau la schimbare select
    ["f-cauta","f-oras","f-salariu-min","f-salariu-max"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") incarcaJoburi(1); });
    });
    ["f-categorie","f-postate-in","f-sortare"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => incarcaJoburi(1));
    });

    // Încarcă joburile imediat — nu necesită autentificare
    incarcaJoburi(1);
  </script>
</body>
</html>
