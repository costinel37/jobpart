<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmare Email - JobPart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-10">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md text-center">
    <a href="/static/index.html" class="text-2xl font-bold text-blue-600 block mb-8">Job<span class="text-gray-800">Part</span></a>

    <div id="stare-incarcare" class="py-8">
      <div class="text-5xl mb-4">⏳</div>
      <p class="text-gray-500">Se confirmă emailul...</p>
    </div>

    <div id="stare-succes" class="hidden py-8">
      <div class="text-6xl mb-4">✅</div>
      <h1 class="text-2xl font-bold text-gray-800 mb-2">Email confirmat!</h1>
      <p class="text-gray-500 mb-6">Contul tău este activ. Te poți autentifica acum.</p>
      <a href="/static/login.html" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-blue-700 inline-block">
        Autentifică-te
      </a>
    </div>

    <div id="stare-eroare" class="hidden py-8">
      <div class="text-6xl mb-4">❌</div>
      <h1 class="text-2xl font-bold text-gray-800 mb-2">Link invalid</h1>
      <p class="text-gray-500 mb-6" id="eroare-mesaj">Link-ul de confirmare este invalid sau a expirat.</p>
      <a href="/static/login.html" class="text-blue-600 hover:underline">Înapoi la login</a>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");

    async function confirma() {
      if (!token) {
        document.getElementById("stare-incarcare").classList.add("hidden");
        document.getElementById("stare-eroare").classList.remove("hidden");
        return;
      }
      try {
        await apiFetch(`/auth/confirma-email?token=${encodeURIComponent(token)}`, { method: "POST" });
        document.getElementById("stare-incarcare").classList.add("hidden");
        document.getElementById("stare-succes").classList.remove("hidden");
      } catch (e) {
        document.getElementById("stare-incarcare").classList.add("hidden");
        document.getElementById("eroare-mesaj").textContent = e.message;
        document.getElementById("stare-eroare").classList.remove("hidden");
      }
    }

    confirma();
  </script>
</body>
</html>
