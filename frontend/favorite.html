<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Joburi Salvate - JobPart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

  <nav class="bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/static/index.html" class="text-2xl font-bold text-blue-600">Job<span class="text-gray-800">Part</span></a>
      <div class="flex items-center gap-4">
        <a href="/static/jobs.html" class="text-gray-600 hover:text-blue-600">Joburi</a>
        <a href="/static/mesaje.html" class="text-gray-600 hover:text-blue-600">âœ‰ï¸ Mesaje</a>
        <a href="/static/notificari.html" id="nav-notif-bell" class="relative inline-flex items-center text-gray-600 hover:text-blue-600">
          <span class="text-xl">ðŸ””</span>
          <span class="notif-badge hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold min-w-[16px] h-4 rounded-full flex items-center justify-center px-1 leading-none"></span>
        </a>
        <span id="nav-username" class="text-gray-700 font-medium"></span>
        <button onclick="logout()" class="px-4 py-2 rounded-lg bg-red-500 text-white hover:bg-red-600 font-medium">IeÈ™ire</button>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-3xl font-bold text-gray-800">â¤ï¸ Joburi salvate</h1>
      <a href="/static/jobs.html" class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 font-medium">+ CautÄƒ joburi</a>
    </div>

    <div id="favorite-list">
      <div class="text-center py-10 text-gray-400">Se Ã®ncarcÄƒ...</div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    const user = getUser();
    if (!user) window.location.href = "/static/login.html";
    document.getElementById("nav-username").textContent = user?.nume || "";

    async function incarcaFavorite() {
      try {
        const jobs = await apiFetch("/favorite");
        const container = document.getElementById("favorite-list");

        if (jobs.length === 0) {
          container.innerHTML = `
            <div class="text-center py-20 bg-white rounded-xl shadow-sm">
              <div class="text-6xl mb-4">ðŸ’”</div>
              <p class="text-xl text-gray-500 mb-2">Nu ai joburi salvate.</p>
              <p class="text-gray-400 mb-6">ApasÄƒ â¤ï¸ pe orice job pentru a-l salva aici.</p>
              <a href="/static/jobs.html" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-700 inline-block">CautÄƒ joburi</a>
            </div>`;
          return;
        }

        container.innerHTML = jobs.map(job => cardJob(job)).join("");
      } catch (e) {
        document.getElementById("favorite-list").innerHTML =
          '<div class="text-center py-10 text-red-400">Eroare la Ã®ncÄƒrcarea joburilor salvate.</div>';
      }
    }

    function salariu(job) {
      if (job.salariu_min) return `${job.salariu_min}${job.salariu_max ? ' - ' + job.salariu_max : '+'} RON`;
      return "Negociabil";
    }

    function cardJob(job) {
      return `
        <div class="bg-white rounded-xl shadow-sm p-5 mb-4 flex justify-between items-start flex-wrap gap-4 hover:shadow-md transition" id="card-${job.id}">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-medium">${job.categorie || 'Part-time'}</span>
              <span class="text-xs text-gray-400">${formatData(job.creat_la)}</span>
            </div>
            <h3 class="font-bold text-gray-800 text-xl mt-2 mb-1">${job.titlu}</h3>
            <p class="text-blue-600 font-semibold mb-2">${job.companie}</p>
            <div class="flex flex-wrap gap-4 text-sm text-gray-500">
              <span>ðŸ“ ${job.oras}</span>
              <span>ðŸ’° ${salariu(job)}</span>
              ${job.tip_program ? `<span>ðŸ• ${job.tip_program}</span>` : ''}
            </div>
          </div>
          <div class="flex flex-col gap-2 items-end">
            <a href="/static/job-detalii.html?id=${job.id}"
              class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 font-medium text-sm">
              Vezi detalii â†’
            </a>
            <button onclick="scoateFavorit(${job.id})"
              class="border border-red-200 text-red-500 px-5 py-2 rounded-lg hover:bg-red-50 font-medium text-sm transition">
              âŒ EliminÄƒ
            </button>
          </div>
        </div>`;
    }

    async function scoateFavorit(jobId) {
      try {
        await apiFetch(`/favorite/${jobId}`, { method: "DELETE" });
        const card = document.getElementById(`card-${jobId}`);
        if (card) {
          card.style.opacity = "0";
          card.style.transition = "opacity 0.3s";
          setTimeout(() => { card.remove(); verificaGol(); }, 300);
        }
      } catch (e) {
        alert(e.message);
      }
    }

    function verificaGol() {
      const container = document.getElementById("favorite-list");
      if (!container.querySelector("[id^='card-']")) {
        container.innerHTML = `
          <div class="text-center py-20 bg-white rounded-xl shadow-sm">
            <div class="text-6xl mb-4">ðŸ’”</div>
            <p class="text-xl text-gray-500 mb-2">Nu ai joburi salvate.</p>
            <a href="/static/jobs.html" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-700 inline-block mt-4">CautÄƒ joburi</a>
          </div>`;
      }
    }

    incarcaFavorite();
    initNotifBell();
  </script>
</body>
</html>
